# Local native-binary setup (no Docker): services expose metrics on
# localhost; Prometheus runs as a plain Windows process.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ingestd
    static_configs:
      - targets: ["127.0.0.1:9101"]
  - job_name: api
    static_configs:
      - targets: ["127.0.0.1:9102"]
  - job_name: feedgen
    static_configs:
      - targets: ["127.0.0.1:9103"]
